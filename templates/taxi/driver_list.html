{% extends "base.html" %}

{% block content %}
  <h2>List of drivers</h2>
  {% if driver_list %}
    <ul>
      {% for driver in driver_list %}
        <li>
          <span>
            <a href="#">{{ driver.username }}</a>: {{ driver.first_name }} {{ driver.last_name }}
          </span>
        </li>
      {% endfor %}
    </ul>
  {% endif %}
{% endblock %}
